name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, ccr-c723d81d-6e65ws]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build (ads off until a real provider is integrated — ADR-008)
        run: GAME_ADS=off npm run build
      - name: Bundle size budget (gzip JS < 400 KB)
        run: test "$(gzip -c dist/assets/app-*.js | wc -c)" -lt 409600
      # Requires one-time repo setup: Settings -> Pages -> Source: GitHub Actions (the workflow token cannot enable Pages itself).
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
